name: Flutter testability lab
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
          cache-key: v1-testability-lab
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: flutter analyze
      - name: Fast unit, BDD and widget tests
        id: fast
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set +e
          flutter test test/reading_list_test.dart test/widget_test.dart --reporter=json > artifacts/fast-tests.json 2> artifacts/fast-tests.stderr
          test_rc=$?
          flutter test test/bdd_test.dart --reporter=json > artifacts/bdd-tests.json 2> artifacts/bdd-tests.stderr
          bdd_rc=$?
          test $test_rc -eq 0 && test $bdd_rc -eq 0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        id: build
        continue-on-error: true
        run: |
          mkdir -p artifacts
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              cp build/app/outputs/flutter-apk/app-debug.apk artifacts/production.apk
              exit $?
            fi
            if [[ $attempt -lt 3 ]]; then sleep 45; fi
          done
          exit 1
      - name: Start Android emulator and run GUI / persistence tests
        id: gui
        timeout-minutes: 35
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          script: bash .github/scripts/run_android_tests.sh
      - name: Generate run report
        if: always()
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          FAST_TESTS: ${{ steps.fast.outcome }}
          GUI_TESTS: ${{ steps.gui.outcome }}
          APK_BUILD: ${{ steps.build.outcome }}
          REPORT_ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tool/create_report.py
      - name: Upload report, screenshots and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testability-report-${{ github.run_id }}
          path: |
            artifacts/report.md
            artifacts/report.json
            artifacts/*.json
            artifacts/*.stderr
            artifacts/*.stdout
            artifacts/*.txt
            artifacts/*.log
            artifacts/persistence.exit
            artifacts/restarted-ui.xml
            artifacts/screenshots/**
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
      - name: Enforce test and build outcomes
        if: always()
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          FAST_TESTS: ${{ steps.fast.outcome }}
          GUI_TESTS: ${{ steps.gui.outcome }}
          APK_BUILD: ${{ steps.build.outcome }}
        run: |
          printf 'analysis=%s fast=%s gui=%s build=%s\n' "$ANALYZE" "$FAST_TESTS" "$GUI_TESTS" "$APK_BUILD"
          test "$ANALYZE" = success && test "$FAST_TESTS" = success && test "$GUI_TESTS" = success && test "$APK_BUILD" = success
