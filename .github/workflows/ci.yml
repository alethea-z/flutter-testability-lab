name: Flutter testability lab
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: flutter analyze
      - name: Fast unit, BDD and widget tests
        id: fast
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set +e
          flutter test --reporter=json > artifacts/fast-tests.json 2> artifacts/fast-tests.stderr
          test_rc=$?
          flutter test test/bdd_test.dart --reporter=json > artifacts/bdd-tests.json 2> artifacts/bdd-tests.stderr
          bdd_rc=$?
          test $test_rc -eq 0 && test $bdd_rc -eq 0
      - name: Start Android emulator and run GUI / persistence tests
        id: gui
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            mkdir -p artifacts/screenshots
            set +e
            flutter test integration_test -d emulator-5554 --reporter=json > artifacts/gui-tests.json 2> artifacts/gui-tests.stderr
            test_rc=$?
            adb shell am force-stop de.alethea.flutter_testability_lab
            adb shell am start -n de.alethea.flutter_testability_lab/.MainActivity
            sleep 8
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml artifacts/restarted-ui.xml
            python3 -c "import pathlib,sys; text=pathlib.Path('artifacts/restarted-ui.xml').read_text(); sys.exit(0 if 'GUI smoke book' in text else 1)"
            persist_rc=$?
            echo "$persist_rc" > artifacts/persistence.exit
            adb exec-out screencap -p > artifacts/screenshots/gui-smoke.png
            test $test_rc -eq 0 && test $persist_rc -eq 0
          
      - name: Build Android APK
        id: build
        if: always()
        continue-on-error: true
        run: flutter build apk --debug
      - name: Generate run report
        if: always()
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          FAST_TESTS: ${{ steps.fast.outcome }}
          GUI_TESTS: ${{ steps.gui.outcome }}
          APK_BUILD: ${{ steps.build.outcome }}
          REPORT_ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tool/create_report.py
      - name: Upload report, screenshots and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testability-report-${{ github.run_id }}
          path: |
            artifacts/report.md
            artifacts/report.json
            artifacts/*.json
            artifacts/*.stderr
            artifacts/persistence.exit
            artifacts/restarted-ui.xml
            artifacts/screenshots/**
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
      - name: Enforce test and build outcomes
        if: always()
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          FAST_TESTS: ${{ steps.fast.outcome }}
          GUI_TESTS: ${{ steps.gui.outcome }}
          APK_BUILD: ${{ steps.build.outcome }}
        run: |
          printf 'analysis=%s fast=%s gui=%s build=%s\n' "$ANALYZE" "$FAST_TESTS" "$GUI_TESTS" "$APK_BUILD"
          test "$ANALYZE" = success && test "$FAST_TESTS" = success && test "$GUI_TESTS" = success && test "$APK_BUILD" = success
